{% extends "learning_logs/base.html" %} {% load bootstrap3 %} {% block header %}
<div class="bg-indigo-600 text-white py-8 text-center rounded-b-xl shadow">
  <h2 class="text-2xl font-semibold">Start a New Discussion</h2>
</div>
{% endblock header %} {% block content %}
<div class="max-w-xl mx-auto mt-10 px-4 bg-white p-6 rounded-xl shadow-md">
  <form
    action="{% url 'learning_logs:new_topic' %}"
    method="post"
    class="space-y-4"
  >
    {% csrf_token %} {% bootstrap_form form %} {% buttons %}
    <button
      name="submit"
      class="w-full bg-indigo-600 text-white py-2 px-4 rounded hover:bg-indigo-700 transition"
    >
      Start Discussion
    </button>
    {% endbuttons %}
  </form>
</div>
{% endblock content %}

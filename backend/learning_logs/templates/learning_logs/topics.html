{% extends "learning_logs/base.html" %} {% block header %}
<div
  class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-10 text-center shadow-md rounded-b-xl"
>
  <h1 class="text-3xl font-bold">Discussions</h1>
</div>
{% endblock header %} {% block content %}
<div class="max-w-3xl mx-auto mt-8 px-4 space-y-6">
  <ul class="space-y-4">
    {% for topic in topics %}
    <li class="bg-white p-4 rounded-lg shadow hover:shadow-lg transition">
      <h4 class="text-xl font-semibold text-indigo-700">
        <a
          href="{% url 'learning_logs:topic' topic.id %}"
          class="hover:underline"
          >{{ topic }}</a
        >
      </h4>
    </li>
    {% empty %}
    <li class="text-center text-gray-600">
      No discussions have been added yet.
    </li>
    {% endfor %}
  </ul>

  <div class="text-center">
    <a
      href="{% url 'learning_logs:new_topic' %}"
      class="inline-block mt-6 px-5 py-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition"
    >
      Start a new discussion
    </a>
  </div>
</div>
{% endblock content %}
